name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # So a run can be started by hand. GitHub occasionally drops a push trigger,
  # and without this there is no way to ask for the run that did not happen.
  workflow_dispatch:

permissions:
  contents: read

# Runs queue rather than cancel. GitHub reports a cancelled run's conclusion as
# `failure`, so cancelling produces red entries in the Actions tab that are not
# failures and cannot be told apart without `gh run view`. This repository is
# the submission and its history is read as evidence, so red must mean red.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up the .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # The build only fails on compiler warnings; whitespace, using order and
      # file encoding are checked here so the .editorconfig is enforced rather
      # than merely documented.
      - name: Verify formatting
        run: dotnet format --verify-no-changes
